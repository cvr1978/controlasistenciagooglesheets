<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Radio toggle (sibling selectors) ── */
    .estado-toggle input[type="radio"] { display:none; }
    .estado-toggle label { padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;
      background:#f8f9ff;color:#888;transition:all .15s;border-right:1px solid #e2e8f0;white-space:nowrap; }
    .estado-toggle label:last-of-type { border-right:none; }
    .estado-toggle input[value="Puntual"]:checked + label  { background:#2e7d32;color:#fff; }
    .estado-toggle input[value="Tarde"]:checked   + label  { background:#e65100;color:#fff; }
    .estado-toggle input[value="Ausente"]:checked + label  { background:#c62828;color:#fff; }
    /* ── Avatar colors set by JS ── */
    .avatar { width:36px;height:36px;border-radius:50%;background:#1a73e8;color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0; }
    .avatar.ausente  { background:#c62828; }
    .avatar.puntual  { background:#2e7d32; }
    .avatar.tarde    { background:#e65100; }
    /* ── Alert states set by JS className ── */
    #alerta.ok    { background:#d9ead3;color:#2e7d32;border-left:5px solid #2e7d32; }
    #alerta.error { background:#fce8e6;color:#c62828;border-left:5px solid #c62828; }
    /* ── Animations ── */
    @keyframes spin    { to{transform:rotate(360deg)} }
    @keyframes fadeIn  { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
    .spinner  { border:3px solid #dbeafe;border-top-color:#1a73e8;border-radius:9999px;
      width:28px;height:28px;animation:spin .7s linear infinite;margin:30px auto; }
    .anim-fade { animation:fadeIn .3s ease; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen" style="font-family:'Segoe UI',system-ui,sans-serif">

<!-- ═══ NAVBAR ═══ -->
<nav class="bg-[#1a73e8] shadow-lg sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4">
    <div class="flex items-center justify-between h-14">
      <span class="text-white font-bold text-base sm:text-lg">📋 Lista de Asistencia</span>
      <div class="hidden sm:flex items-center gap-5">
        <a onclick="nav('')"             href="javascript:void(0)" class="text-white/80 hover:text-white text-sm cursor-pointer transition-colors">📷 Escáner</a>
        <a onclick="nav('dashboard')"    href="javascript:void(0)" class="text-white/80 hover:text-white text-sm cursor-pointer transition-colors">📊 Dashboard</a>
        <a onclick="nav('estudiantes')"  href="javascript:void(0)" class="text-white/80 hover:text-white text-sm cursor-pointer transition-colors">👥 Estudiantes</a>
      </div>
      <button onclick="document.getElementById('mnav').classList.toggle('hidden')"
        class="sm:hidden text-white text-2xl leading-none px-2 py-1 rounded bg-transparent border-0 cursor-pointer">☰</button>
    </div>
  </div>
  <div id="mnav" class="hidden sm:hidden bg-[#1557b0] px-4 pb-3 space-y-0.5">
    <a onclick="nav('');document.getElementById('mnav').classList.add('hidden')"            href="javascript:void(0)" class="flex gap-2 text-white/85 hover:text-white py-2.5 text-sm border-b border-white/10 cursor-pointer">📷 Escáner</a>
    <a onclick="nav('dashboard');document.getElementById('mnav').classList.add('hidden')"   href="javascript:void(0)" class="flex gap-2 text-white/85 hover:text-white py-2.5 text-sm border-b border-white/10 cursor-pointer">📊 Dashboard</a>
    <a onclick="nav('estudiantes');document.getElementById('mnav').classList.add('hidden')" href="javascript:void(0)" class="flex gap-2 text-white/85 hover:text-white py-2.5 text-sm cursor-pointer">👥 Estudiantes</a>
  </div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-5 space-y-5">

  <!-- ═══ FILTROS ═══ -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <div class="bg-[#1a73e8] text-white px-5 py-3.5 text-sm font-semibold">🔍 Seleccionar Grupo</div>
    <div class="p-4 sm:p-5">
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-4">
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Carrera</label>
          <select id="f-carrera" onchange="sincronizarFiltros()"
            class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-[#1a73e8] transition-colors bg-white">
            <option value="Todos">Todos</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Grado</label>
          <select id="f-grado" onchange="sincronizarFiltros()"
            class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-[#1a73e8] transition-colors bg-white">
            <option value="Todos">Todos</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Sección</label>
          <select id="f-seccion"
            class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-[#1a73e8] transition-colors bg-white">
            <option value="Todos">Todos</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Materia</label>
          <input type="text" id="f-materia" placeholder="Ej: Matemáticas"
            class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-[#1a73e8] transition-colors">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Fecha</label>
          <input type="date" id="f-fecha"
            class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-[#1a73e8] transition-colors">
        </div>
      </div>
      <button onclick="cargarLista()"
        class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2.5 bg-[#1a73e8] hover:bg-[#1557b0] text-white rounded-xl text-sm font-semibold transition-colors cursor-pointer border-0">
        📋 Cargar lista de estudiantes
      </button>
    </div>
  </div>

  <!-- ═══ RESUMEN POST-GUARDADO ═══ -->
  <div id="resumen-card" style="display:none" class="bg-white rounded-2xl shadow-sm overflow-hidden anim-fade">
    <div class="bg-[#1a73e8] text-white px-5 py-3.5 font-bold text-sm flex items-center justify-between">
      <span>📊 Resumen de Asistencia</span>
      <button onclick="document.getElementById('resumen-card').style.display='none'"
        class="bg-white/20 border-0 text-white rounded-lg px-3 py-1 text-xs cursor-pointer">✕ Cerrar</button>
    </div>
    <div class="p-4 sm:p-5">
      <p class="text-xs text-gray-500 mb-4" id="rc-fecha-txt"></p>
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-slate-50 rounded-xl p-3 text-center">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Total</p>
          <p class="text-2xl font-extrabold text-[#1a73e8]" id="rc-total">0</p>
          <div class="grid grid-cols-2 gap-1 mt-2">
            <div class="bg-white rounded-lg px-1.5 py-1 flex justify-between text-[11px]"><span>♂ H</span><strong id="rc-totalH">0</strong></div>
            <div class="bg-white rounded-lg px-1.5 py-1 flex justify-between text-[11px]"><span>♀ M</span><strong id="rc-totalM">0</strong></div>
          </div>
        </div>
        <div class="bg-slate-50 rounded-xl p-3 text-center">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Presentes</p>
          <p class="text-2xl font-extrabold text-[#2e7d32]" id="rc-presentes">0</p>
          <div class="grid grid-cols-2 gap-1 mt-2">
            <div class="bg-white rounded-lg px-1.5 py-1 flex justify-between text-[11px]"><span>♂ H</span><strong id="rc-presentesH">0</strong></div>
            <div class="bg-white rounded-lg px-1.5 py-1 flex justify-between text-[11px]"><span>♀ M</span><strong id="rc-presentesM">0</strong></div>
          </div>
        </div>
        <div class="bg-slate-50 rounded-xl p-3 text-center">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Ausentes</p>
          <p class="text-2xl font-extrabold text-[#c62828]" id="rc-ausentes">0</p>
          <div class="grid grid-cols-2 gap-1 mt-2">
            <div class="bg-white rounded-lg px-1.5 py-1 flex justify-between text-[11px]"><span>♂ H</span><strong id="rc-ausentesH">0</strong></div>
            <div class="bg-white rounded-lg px-1.5 py-1 flex justify-between text-[11px]"><span>♀ M</span><strong id="rc-ausentesM">0</strong></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ LISTA ═══ -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden" id="card-lista" style="display:none">
    <div class="bg-[#1a73e8] text-white px-5 py-3.5 text-sm font-semibold">
      <span id="lista-titulo">Estudiantes</span>
    </div>
    <div class="p-4 sm:p-5">

      <div id="alerta" style="display:none" class="px-4 py-3 rounded-xl text-sm font-medium mb-4 anim-fade"></div>

      <!-- Contadores -->
      <div class="flex flex-wrap gap-2 mb-4">
        <div class="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2 text-xs font-semibold">
          <span class="w-2.5 h-2.5 rounded-full bg-[#2e7d32]"></span>
          <span class="text-[#1a73e8] font-extrabold text-base" id="cnt-p">0</span> Puntuales
        </div>
        <div class="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2 text-xs font-semibold">
          <span class="w-2.5 h-2.5 rounded-full bg-[#e65100]"></span>
          <span class="text-[#1a73e8] font-extrabold text-base" id="cnt-t">0</span> Tardíos
        </div>
        <div class="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2 text-xs font-semibold">
          <span class="w-2.5 h-2.5 rounded-full bg-[#c62828]"></span>
          <span class="text-[#1a73e8] font-extrabold text-base" id="cnt-a">0</span> Ausentes
        </div>
        <div class="ml-auto flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2 text-xs font-semibold">
          Total: <span class="text-[#1a73e8] font-extrabold text-base" id="cnt-total">0</span>
        </div>
      </div>

      <!-- Acciones rápidas -->
      <div class="flex flex-wrap gap-2 pb-3 border-b border-slate-100 mb-4">
        <button onclick="marcarTodos('Puntual')"
          class="flex items-center gap-1.5 px-3 py-1.5 bg-white text-[#1a73e8] border-2 border-[#1a73e8] hover:bg-[#e8f0fe] rounded-xl text-xs font-bold cursor-pointer transition-colors">
          ✅ Todos presentes
        </button>
        <button onclick="marcarTodos('Tarde')"
          class="flex items-center gap-1.5 px-3 py-1.5 bg-white text-[#1a73e8] border-2 border-[#1a73e8] hover:bg-[#e8f0fe] rounded-xl text-xs font-bold cursor-pointer transition-colors">
          ⚠ Todos tarde
        </button>
        <button onclick="marcarTodos('Ausente')"
          class="flex items-center gap-1.5 px-3 py-1.5 bg-white text-[#1a73e8] border-2 border-[#1a73e8] hover:bg-[#e8f0fe] rounded-xl text-xs font-bold cursor-pointer transition-colors">
          ❌ Todos ausentes
        </button>
      </div>

      <div id="lista-body"><div class="spinner"></div></div>

      <div class="mt-4">
        <button id="btn-guardar" onclick="guardarAsistencia()" disabled
          class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-[#2e7d32] hover:bg-[#1b5e20] disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl text-sm font-bold transition-colors cursor-pointer border-0">
          💾 Guardar asistencia
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  let estudiantesActuales = [];
  let filtrosDisponibles  = { carreras: [], grados: [], secciones: [] };

  // ── Navegación ──
  let _webAppUrl = '';
  function nav(page) {
    const go = u => { window.top.location.href = u + (page ? '?page=' + page : ''); };
    if (_webAppUrl) go(_webAppUrl);
    else google.script.run.withSuccessHandler(u => { _webAppUrl = u; go(u); }).getWebAppUrl();
  }

  // ── Init ──
  window.onload = () => {
    google.script.run.withSuccessHandler(u => { _webAppUrl = u; }).getWebAppUrl();
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('f-fecha').value = hoy;
    google.script.run
      .withSuccessHandler(data => {
        filtrosDisponibles = data;
        poblarSelect('f-carrera',  data.carreras);
        poblarSelect('f-grado',    data.grados);
        poblarSelect('f-seccion',  data.secciones);
      })
      .obtenerFiltrosDisponibles();
  };

  function poblarSelect(id, valores) {
    const sel = document.getElementById(id);
    const actual = sel.value;
    sel.innerHTML = '<option value="Todos">Todos</option>';
    valores.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
    if (actual) sel.value = actual;
  }

  function sincronizarFiltros() {}

  // ── Cargar lista ──
  function cargarLista() {
    const carrera = document.getElementById('f-carrera').value;
    const grado   = document.getElementById('f-grado').value;
    const seccion = document.getElementById('f-seccion').value;
    const fecha   = document.getElementById('f-fecha').value;
    document.getElementById('card-lista').style.display = '';
    document.getElementById('lista-body').innerHTML = '<div class="spinner"></div>';
    document.getElementById('btn-guardar').disabled = true;
    const partes = [carrera!=='Todos'?carrera:null, grado!=='Todos'?'Grado '+grado:null, seccion!=='Todos'?'Sección '+seccion:null].filter(Boolean);
    document.getElementById('lista-titulo').textContent =
      (partes.length ? partes.join(' · ') : 'Todos los estudiantes') + ' — ' + fecha;
    google.script.run
      .withSuccessHandler(data => {
        estudiantesActuales = data;
        renderLista(data);
        document.getElementById('btn-guardar').disabled = data.length === 0;
      })
      .withFailureHandler(() => { document.getElementById('lista-body').innerHTML = '<div class="text-center text-gray-400 py-10">Error al cargar estudiantes</div>'; })
      .obtenerEstudiantesPorGrupo(carrera, grado, seccion, fecha);
  }

  // ── Render ──
  function renderLista(data) {
    if (!data || data.length === 0) {
      document.getElementById('lista-body').innerHTML =
        '<div class="text-center text-gray-400 py-10 text-sm">No se encontraron estudiantes con esos filtros.<br>Verifica que tengan Grado y Sección asignados.</div>';
      actualizarContadores(); return;
    }
    const html = data.map((e, idx) => {
      const estado = e.estadoHoy || 'Ausente';
      return `<div class="student-row" id="row-${idx}"
        style="display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #f0f4f8;border-radius:8px;transition:background .15s;"
        onmouseover="this.style.background='#f8f9ff'" onmouseout="this.style.background=''">
        <div class="avatar ${estado.toLowerCase()}" id="av-${idx}">${e.nombre.charAt(0).toUpperCase()}</div>
        <div>
          <div style="font-size:14px;font-weight:600;color:#1a1a1a;">${e.nombre}</div>
          <div style="font-size:11px;color:#888;margin-top:2px;">${e.id} · ${[e.carrera, e.grado?'G'+e.grado:'', e.seccion?'Sec.'+e.seccion:''].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="estado-toggle" style="display:flex;border-radius:8px;overflow:hidden;border:2px solid #ddd;flex-shrink:0;">
          <input type="radio" name="est-${idx}" id="p-${idx}" value="Puntual" ${estado==='Puntual'?'checked':''} onchange="onEstadoCambio(${idx})">
          <label for="p-${idx}">✅ Puntual</label>
          <input type="radio" name="est-${idx}" id="t-${idx}" value="Tarde"   ${estado==='Tarde'?'checked':''} onchange="onEstadoCambio(${idx})">
          <label for="t-${idx}">⚠ Tarde</label>
          <input type="radio" name="est-${idx}" id="a-${idx}" value="Ausente" ${estado==='Ausente'?'checked':''} onchange="onEstadoCambio(${idx})">
          <label for="a-${idx}">❌ Ausente</label>
        </div>
      </div>`;
    }).join('');
    document.getElementById('lista-body').innerHTML = `<div>${html}</div>`;
    actualizarContadores();
  }

  function onEstadoCambio(idx) {
    const val = document.querySelector(`input[name="est-${idx}"]:checked`).value;
    document.getElementById('av-' + idx).className = 'avatar ' + val.toLowerCase();
    actualizarContadores();
  }

  function marcarTodos(estado) {
    estudiantesActuales.forEach((e, idx) => {
      const r = document.querySelector(`input[name="est-${idx}"][value="${estado}"]`);
      if (r) { r.checked = true; onEstadoCambio(idx); }
    });
  }

  function actualizarContadores() {
    let p = 0, t = 0, a = 0;
    estudiantesActuales.forEach((e, idx) => {
      const r = document.querySelector(`input[name="est-${idx}"]:checked`);
      if (!r) return;
      if (r.value === 'Puntual') p++;
      else if (r.value === 'Tarde') t++;
      else a++;
    });
    document.getElementById('cnt-p').textContent     = p;
    document.getElementById('cnt-t').textContent     = t;
    document.getElementById('cnt-a').textContent     = a;
    document.getElementById('cnt-total').textContent = estudiantesActuales.length;
  }

  // ── Guardar ──
  function guardarAsistencia() {
    const registros = estudiantesActuales.map((e, idx) => {
      const r = document.querySelector(`input[name="est-${idx}"]:checked`);
      return { id: e.id, observacion: r ? r.value : 'Ausente' };
    });
    const materia = document.getElementById('f-materia').value.trim() || 'General';
    const fecha   = document.getElementById('f-fecha').value;
    const btn     = document.getElementById('btn-guardar');
    btn.disabled = true; btn.textContent = '⏳ Guardando...';
    google.script.run
      .withSuccessHandler(res => {
        mostrarAlerta(res.mensaje, res.ok);
        btn.disabled = false; btn.textContent = '💾 Guardar asistencia';
        if (res.ok) { cargarLista(); if (res.resumen) mostrarResumen(res.resumen); }
      })
      .withFailureHandler(err => {
        mostrarAlerta('Error de conexión: ' + err.message, false);
        btn.disabled = false; btn.textContent = '💾 Guardar asistencia';
      })
      .registrarAsistenciaMasiva(registros, materia, fecha);
  }

  function mostrarResumen(r) {
    document.getElementById('rc-fecha-txt').textContent    = 'Fecha: ' + r.fecha + (r.materia&&r.materia!=='General'?'  ·  Materia: '+r.materia:'');
    document.getElementById('rc-total').textContent        = r.total;
    document.getElementById('rc-totalH').textContent       = r.totalH;
    document.getElementById('rc-totalM').textContent       = r.totalM;
    document.getElementById('rc-presentes').textContent    = r.presentes;
    document.getElementById('rc-presentesH').textContent   = r.presentesH;
    document.getElementById('rc-presentesM').textContent   = r.presentesM;
    document.getElementById('rc-ausentes').textContent     = r.ausentes;
    document.getElementById('rc-ausentesH').textContent    = r.ausentesH;
    document.getElementById('rc-ausentesM').textContent    = r.ausentesM;
    const card = document.getElementById('resumen-card');
    card.style.display = '';
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function mostrarAlerta(msg, ok) {
    const el = document.getElementById('alerta');
    el.textContent = msg; el.className = ok ? 'ok' : 'error';
    el.style.display = 'block';
    el.style.padding = '12px 16px';
    el.style.borderRadius = '12px';
    el.style.fontSize = '14px';
    el.style.marginBottom = '16px';
    setTimeout(() => { el.style.display = 'none'; }, 5000);
  }
</script>
</body>
</html>
