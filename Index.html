<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    /* ---- NAV ---- */
    nav {
      background: #1a73e8;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    nav .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    nav .nav-links a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
      transition: color .2s;
    }
    nav .nav-links a:hover { color: #fff; }

    /* ---- LAYOUT ---- */
    .container {
      max-width: 660px;
      margin: 30px auto;
      padding: 0 16px;
    }

    /* ---- CARD ---- */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      background: #1a73e8;
      color: #fff;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-body { padding: 20px; }

    /* ---- SCANNER ---- */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #1a73e8;
    }

    /* ---- RESULTADO ---- */
    #resultado {
      display: none;
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 16px;
      font-size: 15px;
      animation: fadeIn .4s ease;
    }
    #resultado.ok    { background: #d9ead3; border-left: 5px solid #2e7d32; color: #1b5e20; }
    #resultado.error { background: #fce8e6; border-left: 5px solid #c62828; color: #b71c1c; }
    #resultado.warn  { background: #fff3e0; border-left: 5px solid #e65100; color: #bf360c; }

    .resultado-icon { font-size: 32px; margin-bottom: 8px; }
    .resultado-nombre { font-size: 20px; font-weight: 700; margin: 4px 0; }
    .resultado-detalle { font-size: 13px; opacity: .8; }
    .resultado-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
    }
    .badge-puntual { background: #2e7d32; color: #fff; }
    .badge-tarde   { background: #e65100; color: #fff; }

    /* ---- CONTROLES ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all .2s;
    }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1557b0; }
    .btn-danger  { background: #ea4335; color: #fff; }
    .btn-danger:hover  { background: #b71c1c; }
    .btn-block { width: 100%; justify-content: center; margin-top: 12px; }

    /* ---- MANUAL / GRUPO ---- */
    .filtros-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .fg label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
    .fg select, .fg input {
      width: 100%; padding: 9px 10px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 13px; outline: none;
      transition: border-color .2s; background: #fff;
    }
    .fg select:focus, .fg input:focus { border-color: #1a73e8; }

    /* Contadores mini */
    .mini-contadores {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .mini-cnt {
      display: flex; align-items: center; gap: 5px;
      background: #f8f9ff; border-radius: 6px; padding: 4px 10px;
      font-size: 12px; font-weight: 700;
    }
    .cdot { width: 8px; height: 8px; border-radius: 50%; }
    .cdot-p { background: #2e7d32; }
    .cdot-t { background: #e65100; }
    .cdot-a { background: #c62828; }
    .mini-val { color: #1a73e8; font-size: 15px; font-weight: 800; }

    /* Toolbar rápida */
    .quick-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 8px 0; border-bottom: 1px solid #f0f4f8; margin-bottom: 12px;
    }
    .btn-xs { padding: 5px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; }
    .btn-xs-success { background: #d9ead3; color: #2e7d32; }
    .btn-xs-danger  { background: #fce8e6; color: #c62828; }
    .btn-xs-warn    { background: #fff3e0; color: #e65100; }

    /* Fila de estudiante en lista grupo */
    .glista { display: flex; flex-direction: column; gap: 0; }
    .grow {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 6px;
      border-bottom: 1px solid #f0f4f8;
      border-radius: 8px;
      transition: background .15s;
    }
    .grow:hover { background: #f8f9ff; }
    .grow:last-child { border-bottom: none; }

    .gavatar {
      width: 34px; height: 34px; border-radius: 50%;
      color: #fff; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .gavatar.puntual { background: #2e7d32; }
    .gavatar.tarde   { background: #e65100; }
    .gavatar.ausente { background: #c62828; }
    .gavatar.nuevo   { background: #1a73e8; }

    .ginfo .gnombre { font-size: 13px; font-weight: 700; }
    .ginfo .gmeta   { font-size: 11px; color: #888; }

    /* Toggle estado */
    .etoggle { display: flex; border-radius: 7px; overflow: hidden; border: 2px solid #ddd; flex-shrink: 0; }
    .etoggle input[type="radio"] { display: none; }
    .etoggle label {
      padding: 5px 10px; font-size: 11px; font-weight: 700;
      cursor: pointer; background: #f8f9ff; color: #999;
      transition: all .15s; border-right: 1px solid #ddd; white-space: nowrap;
    }
    .etoggle label:last-of-type { border-right: none; }
    .etoggle input[value="Puntual"]:checked + label { background: #2e7d32; color: #fff; }
    .etoggle input[value="Tarde"]:checked   + label { background: #e65100; color: #fff; }
    .etoggle input[value="Ausente"]:checked + label { background: #c62828; color: #fff; }
    .grow.locked .etoggle { pointer-events: none; opacity: .6; }

    .qr-lbl {
      font-size: 10px; background: #e8f0fe; color: #1a73e8;
      border-radius: 4px; padding: 1px 5px; font-weight: 700; margin-left: 5px;
    }

    /* Alerta en lista grupo */
    #alerta-grupo {
      display: none; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 12px;
    }
    #alerta-grupo.ok    { background: #d9ead3; color: #2e7d32; border-left: 4px solid #2e7d32; }
    #alerta-grupo.error { background: #fce8e6; color: #c62828; border-left: 4px solid #c62828; }

    .btn-success { background: #2e7d32; color: #fff; }
    .btn-success:hover { background: #1b5e20; }
    .btn-sm { padding: 7px 14px; font-size: 13px; }

    /* ---- HISTORIAL ---- */
    .historial-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f4f8;
    }
    .historial-item:last-child { border-bottom: none; }
    .hist-hora {
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      min-width: 60px;
      text-align: center;
    }
    .hist-nombre { font-size: 14px; font-weight: 600; }
    .hist-id     { font-size: 12px; color: #666; }
    .hist-badge  {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .hist-badge.p { background: #d9ead3; color: #2e7d32; }
    .hist-badge.t { background: #fff3e0; color: #e65100; }

    /* ---- STATUS ---- */
    #status-bar {
      text-align: center;
      font-size: 13px;
      color: #666;
      padding: 8px 0;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .dot.active   { background: #2e7d32; animation: pulse 1.5s infinite; }
    .dot.inactive { background: #999; }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: .4; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      border: 3px solid #e8f0fe;
      border-top: 3px solid #1a73e8;
      border-radius: 50%;
      width: 22px; height: 22px;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

<nav>
  <div class="brand">📷 Asistencia QR</div>
  <div class="nav-links">
    <a href="?page=lista">📋 Lista</a>
    <a href="?page=dashboard">📊 Dashboard</a>
    <a href="?page=estudiantes">👥 Estudiantes</a>
  </div>
</nav>

<div class="container">

  <!-- ===== ESCÁNER ===== -->
  <div class="card">
    <div class="card-header">📷 Escáner de QR</div>
    <div class="card-body">
      <div id="status-bar">
        <span class="dot inactive" id="dot"></span>
        <span id="status-text">Iniciando cámara...</span>
      </div>
      <div id="reader"></div>

      <!-- Resultado del escaneo -->
      <div id="resultado">
        <div class="resultado-icon" id="res-icon"></div>
        <div class="resultado-nombre" id="res-nombre"></div>
        <div class="resultado-detalle" id="res-detalle"></div>
        <span class="resultado-badge" id="res-badge"></span>
      </div>

      <button class="btn btn-danger btn-block" id="btn-stop" onclick="detenerEscaner()" style="display:none;">
        ⏹ Detener escáner
      </button>
      <button class="btn btn-primary btn-block" id="btn-start" onclick="iniciarEscaner()">
        ▶ Iniciar escáner
      </button>
    </div>
  </div>

  <!-- ===== REGISTRO POR GRUPO ===== -->
  <div class="card">
    <div class="card-header">
      <span>⌨ Registro Manual por Grupo</span>
      <button class="btn btn-success btn-sm" id="btn-guardar-grupo" onclick="guardarListaGrupo()" style="display:none;">
        💾 Guardar
      </button>
    </div>
    <div class="card-body">

      <!-- Filtros -->
      <div class="filtros-grid">
        <div class="fg">
          <label>Carrera</label>
          <select id="mg-carrera"><option value="Todos">Todos</option></select>
        </div>
        <div class="fg">
          <label>Grado</label>
          <select id="mg-grado"><option value="Todos">Todos</option></select>
        </div>
        <div class="fg">
          <label>Sección</label>
          <select id="mg-seccion"><option value="Todos">Todos</option></select>
        </div>
        <div class="fg">
          <label>Materia</label>
          <input type="text" id="mg-materia" placeholder="Ej: Matemáticas">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="cargarListaGrupo()">
        📋 Cargar estudiantes
      </button>

      <!-- Lista resultante -->
      <div id="mg-lista" style="margin-top:16px;display:none;">
        <div id="alerta-grupo"></div>

        <!-- Contadores -->
        <div class="mini-contadores">
          <div class="mini-cnt"><span class="cdot cdot-p"></span><span class="mini-val" id="mg-cp">0</span> Puntuales</div>
          <div class="mini-cnt"><span class="cdot cdot-t"></span><span class="mini-val" id="mg-ct">0</span> Tardíos</div>
          <div class="mini-cnt"><span class="cdot cdot-a"></span><span class="mini-val" id="mg-ca">0</span> Ausentes</div>
          <div class="mini-cnt" style="margin-left:auto;">Total: <span class="mini-val" id="mg-ctotal">0</span></div>
        </div>

        <!-- Acciones rápidas -->
        <div class="quick-bar">
          <button class="btn-xs btn-xs-success" onclick="marcarTodosGrupo('Puntual')">✅ Todos presentes</button>
          <button class="btn-xs btn-xs-warn"    onclick="marcarTodosGrupo('Tarde')">⚠ Todos tarde</button>
          <button class="btn-xs btn-xs-danger"  onclick="marcarTodosGrupo('Ausente')">❌ Todos ausentes</button>
          <span style="font-size:10px;color:#aaa;margin-left:auto;">
            <span class="qr-lbl">QR</span> ya registrado
          </span>
        </div>

        <div id="mg-body"></div>
      </div>

    </div>
  </div>

  <!-- ===== HISTORIAL DEL DÍA ===== -->
  <div class="card">
    <div class="card-header">📋 Asistencia de Hoy (<span id="cont-presentes">0</span> presentes)</div>
    <div class="card-body" id="historial-body">
      <div class="empty-state">Sin registros por ahora</div>
    </div>
  </div>

</div>

<script>
  let html5QrCode = null;
  let escaneando  = false;
  let ultimoCodigo = '';
  let historial    = [];

  // ---- INICIAR ESCÁNER ----
  function iniciarEscaner() {
    html5QrCode = new Html5Qrcode('reader');
    const config = {
      fps: 10,
      qrbox: { width: 260, height: 260 },
      aspectRatio: 1.0
    };

    Html5Qrcode.getCameras().then(cameras => {
      if (!cameras || cameras.length === 0) {
        mostrarEstado(false, 'No se encontró cámara disponible.');
        return;
      }
      // Preferir cámara trasera
      const camId = cameras.find(c => /back|rear|environment/i.test(c.label))?.id || cameras[cameras.length - 1].id;

      html5QrCode.start(camId, config, onQrSuccess, onQrError)
        .then(() => {
          escaneando = true;
          document.getElementById('dot').className = 'dot active';
          document.getElementById('status-text').textContent = 'Escáner activo — apunta al QR del carnet';
          document.getElementById('btn-stop').style.display = '';
          document.getElementById('btn-start').style.display = 'none';
        })
        .catch(err => mostrarEstado(false, 'No se pudo iniciar: ' + err));
    }).catch(() => mostrarEstado(false, 'Error al acceder a la cámara.'));
  }

  // ---- DETENER ----
  function detenerEscaner() {
    if (html5QrCode && escaneando) {
      html5QrCode.stop().then(() => {
        escaneando = false;
        document.getElementById('dot').className = 'dot inactive';
        document.getElementById('status-text').textContent = 'Escáner detenido';
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('btn-start').style.display = '';
      });
    }
  }

  // ---- CUANDO LEE QR ----
  function onQrSuccess(decodedText) {
    if (decodedText === ultimoCodigo) return; // evitar doble registro
    ultimoCodigo = decodedText;
    setTimeout(() => { ultimoCodigo = ''; }, 4000);

    // Feedback visual inmediato
    mostrarCargando();
    procesarCodigo(decodedText);
  }

  function onQrError() { /* silencioso */ }

  // ---- REGISTRO POR GRUPO ----
  let grupoEstudiantes = [];

  function cargarFiltrosGrupo() {
    google.script.run
      .withSuccessHandler(data => {
        poblarSelect('mg-carrera',  data.carreras);
        poblarSelect('mg-grado',    data.grados);
        poblarSelect('mg-seccion',  data.secciones);
      })
      .obtenerFiltrosDisponibles();
  }

  function poblarSelect(id, valores) {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="Todos">Todos</option>';
    valores.forEach(v => {
      const o = document.createElement('option');
      o.value = o.textContent = v;
      sel.appendChild(o);
    });
  }

  function cargarListaGrupo() {
    const carrera = document.getElementById('mg-carrera').value;
    const grado   = document.getElementById('mg-grado').value;
    const seccion = document.getElementById('mg-seccion').value;
    const fecha   = new Date().toISOString().split('T')[0];

    document.getElementById('mg-lista').style.display = '';
    document.getElementById('mg-body').innerHTML = '<div style="text-align:center;padding:16px;"><div class="spinner"></div></div>';
    document.getElementById('btn-guardar-grupo').style.display = 'none';

    google.script.run
      .withSuccessHandler(data => {
        grupoEstudiantes = data;
        renderGrupo(data);
        document.getElementById('btn-guardar-grupo').style.display = data.length ? '' : 'none';
      })
      .withFailureHandler(() => {
        document.getElementById('mg-body').innerHTML = '<div class="empty-state">Error al cargar</div>';
      })
      .obtenerEstudiantesPorGrupo(carrera, grado, seccion, fecha);
  }

  function renderGrupo(data) {
    if (!data || data.length === 0) {
      document.getElementById('mg-body').innerHTML =
        '<div class="empty-state" style="padding:20px 0;">No hay estudiantes con esos filtros.<br><small>Asegúrate de asignarles Grado y Sección.</small></div>';
      actualizarContadoresGrupo();
      return;
    }

    document.getElementById('mg-body').innerHTML = `
      <div class="glista">
        ${data.map((e, i) => {
          const locked = e.estadoHoy !== null;
          const estado = e.estadoHoy || 'Ausente';
          return `
            <div class="grow ${locked ? 'locked' : ''}" id="grow-${i}">
              <div class="gavatar ${estado.toLowerCase()}" id="gav-${i}">${e.nombre.charAt(0).toUpperCase()}</div>
              <div class="ginfo">
                <div class="gnombre">${e.nombre}${locked ? '<span class="qr-lbl">QR</span>' : ''}</div>
                <div class="gmeta">${e.id} · ${[e.carrera, e.grado ? 'G' + e.grado : '', e.seccion ? 'Sec.' + e.seccion : ''].filter(Boolean).join(' · ')}</div>
              </div>
              <div class="etoggle">
                <input type="radio" name="eg-${i}" id="ep-${i}" value="Puntual"
                  ${estado === 'Puntual' ? 'checked' : ''} onchange="onEstadoGrupoCambio(${i})">
                <label for="ep-${i}">✅</label>
                <input type="radio" name="eg-${i}" id="et-${i}" value="Tarde"
                  ${estado === 'Tarde' ? 'checked' : ''} onchange="onEstadoGrupoCambio(${i})">
                <label for="et-${i}">⚠</label>
                <input type="radio" name="eg-${i}" id="ea-${i}" value="Ausente"
                  ${estado === 'Ausente' || !e.estadoHoy ? 'checked' : ''} onchange="onEstadoGrupoCambio(${i})">
                <label for="ea-${i}">❌</label>
              </div>
            </div>`;
        }).join('')}
      </div>`;

    actualizarContadoresGrupo();
  }

  function onEstadoGrupoCambio(i) {
    const val = document.querySelector(`input[name="eg-${i}"]:checked`).value;
    const av  = document.getElementById('gav-' + i);
    av.className = 'gavatar ' + val.toLowerCase();
    actualizarContadoresGrupo();
  }

  function marcarTodosGrupo(estado) {
    grupoEstudiantes.forEach((e, i) => {
      if (e.estadoHoy !== null) return;
      const r = document.querySelector(`input[name="eg-${i}"][value="${estado}"]`);
      if (r) { r.checked = true; onEstadoGrupoCambio(i); }
    });
  }

  function actualizarContadoresGrupo() {
    let p = 0, t = 0, a = 0;
    grupoEstudiantes.forEach((_, i) => {
      const r = document.querySelector(`input[name="eg-${i}"]:checked`);
      if (!r) return;
      if (r.value === 'Puntual') p++;
      else if (r.value === 'Tarde') t++;
      else a++;
    });
    document.getElementById('mg-cp').textContent    = p;
    document.getElementById('mg-ct').textContent    = t;
    document.getElementById('mg-ca').textContent    = a;
    document.getElementById('mg-ctotal').textContent = grupoEstudiantes.length;
  }

  function guardarListaGrupo() {
    const registros = grupoEstudiantes
      .filter((e, i) => e.estadoHoy === null)  // omitir ya registrados por QR
      .map((e, _) => {
        const idx = grupoEstudiantes.indexOf(e);
        const r   = document.querySelector(`input[name="eg-${idx}"]:checked`);
        return { id: e.id, observacion: r ? r.value : 'Ausente' };
      });

    const materia = document.getElementById('mg-materia').value.trim() || 'General';
    const fecha   = new Date().toISOString().split('T')[0];

    document.getElementById('btn-guardar-grupo').disabled = true;
    document.getElementById('btn-guardar-grupo').textContent = '⏳ Guardando...';

    google.script.run
      .withSuccessHandler(res => {
        const el = document.getElementById('alerta-grupo');
        el.textContent  = res.mensaje;
        el.className    = res.ok ? 'ok' : 'error';
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);

        document.getElementById('btn-guardar-grupo').disabled = false;
        document.getElementById('btn-guardar-grupo').textContent = '💾 Guardar';

        if (res.ok) {
          cargarListaGrupo();     // recargar para mostrar bloqueados
          cargarHistorialHoy();   // actualizar historial general
        }
      })
      .withFailureHandler(err => {
        const el = document.getElementById('alerta-grupo');
        el.textContent  = 'Error: ' + err.message;
        el.className    = 'error';
        el.style.display = 'block';
        document.getElementById('btn-guardar-grupo').disabled = false;
        document.getElementById('btn-guardar-grupo').textContent = '💾 Guardar';
      })
      .registrarAsistenciaMasiva(registros, materia, fecha);
  }

  // ---- LLAMADA AL SERVIDOR ----
  function procesarCodigo(codigo) {
    google.script.run
      .withSuccessHandler(respuesta => mostrarRespuesta(respuesta))
      .withFailureHandler(err => mostrarRespuesta({ ok: false, mensaje: 'Error de conexión: ' + err.message }))
      .registrarAsistencia(codigo);
  }

  // ---- UI: RESULTADO ----
  function mostrarCargando() {
    const div = document.getElementById('resultado');
    div.className = '';
    div.style.display = 'block';
    div.innerHTML = '<div style="text-align:center;padding:12px;"><div class="spinner"></div><br><small>Registrando...</small></div>';
  }

  function mostrarRespuesta(r) {
    const div    = document.getElementById('resultado');
    div.style.display = 'block';
    div.style.animation = 'none';
    void div.offsetWidth; // reflow
    div.style.animation = '';

    if (r.ok) {
      div.className = 'ok';
      const badgeClass = r.observacion === 'Puntual' ? 'badge-puntual' : 'badge-tarde';
      div.innerHTML = `
        <div class="resultado-icon">✅</div>
        <div class="resultado-nombre">${r.estudiante.nombre}</div>
        <div class="resultado-detalle">${r.estudiante.id} · ${r.estudiante.programa}</div>
        <div class="resultado-detalle">Hora: ${r.hora}</div>
        <span class="resultado-badge ${badgeClass}">${r.observacion}</span>
      `;
      // Agregar al historial local
      historial.unshift(r);
      renderHistorial();
    } else if (r.estudiante) {
      div.className = 'warn';
      div.innerHTML = `
        <div class="resultado-icon">⚠️</div>
        <div class="resultado-nombre">${r.estudiante.nombre}</div>
        <div class="resultado-detalle">${r.mensaje}</div>
      `;
    } else {
      div.className = 'error';
      div.innerHTML = `
        <div class="resultado-icon">❌</div>
        <div class="resultado-nombre">No encontrado</div>
        <div class="resultado-detalle">${r.mensaje}</div>
      `;
    }

    // Auto ocultar tras 5 s
    clearTimeout(window._hideTimeout);
    window._hideTimeout = setTimeout(() => {
      div.style.display = 'none';
    }, 5000);
  }

  function mostrarEstado(ok, msg) {
    document.getElementById('status-text').textContent = msg;
    document.getElementById('dot').className = ok ? 'dot active' : 'dot inactive';
  }

  // ---- HISTORIAL DEL DÍA (carga inicial) ----
  function cargarHistorialHoy() {
    google.script.run
      .withSuccessHandler(resumen => {
        document.getElementById('cont-presentes').textContent = resumen.presentes;
        historial = resumen.registros.map(r => ({
          ok: true,
          estudiante: { nombre: r.nombre, id: r.id, programa: r.programa },
          hora: r.hora,
          observacion: r.obs
        }));
        renderHistorial();
      })
      .obtenerResumenHoy();
  }

  function renderHistorial() {
    const body = document.getElementById('historial-body');
    document.getElementById('cont-presentes').textContent = historial.length;
    if (historial.length === 0) {
      body.innerHTML = '<div class="empty-state">Sin registros por ahora</div>';
      return;
    }
    body.innerHTML = historial.map(r => `
      <div class="historial-item">
        <div class="hist-hora">${r.hora ? r.hora.substring(0,5) : '--:--'}</div>
        <div>
          <div class="hist-nombre">${r.estudiante.nombre}</div>
          <div class="hist-id">${r.estudiante.id}</div>
        </div>
        <span class="hist-badge ${r.observacion === 'Puntual' ? 'p' : 't'}">${r.observacion}</span>
      </div>
    `).join('');
  }

  // ---- INIT ----
  window.onload = () => {
    cargarHistorialHoy();
    cargarFiltrosGrupo();
    iniciarEscaner();
  };
</script>
</body>
</html>
